name: asymmetry

on:
  push:
    paths: [ ".github/workflows/asymmetry.yml", "handle-asymmetry.pl" ]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        perl:
          - '5.12.5'
          - '5.16.3'
          - '5.20.3'
          - '5.26.3'
          - '5.32.1'
          - '5.36.3'
          - '5.38.5'
          - '5.40.4'
          - '5.42.2'
          - '5.44.0'
    name: perl ${{ matrix.perl }}
    steps:
      - uses: actions/checkout@v5
      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}
      - name: probe
        run: |
          perl handle-asymmetry.pl >/dev/null 2>&1 || true
          cat ${TMPDIR:-/tmp}/asym-*.out | tee -a "$GITHUB_STEP_SUMMARY"
